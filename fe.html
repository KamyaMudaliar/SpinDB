<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen p-6">
  <div class="max-w-4xl mx-auto">

    <!-- Search Bar -->
    <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
      <div class="flex gap-3">
        <input 
          type="text" 
          id="searchInput" 
          class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
          placeholder="Search for packages..."
        />
        <button 
          id="searchBtn"
          class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50"
        >
          <span id="btnText">Search</span>
          <span id="btnSpinner" class="hidden">
            <svg class="animate-spin w-4 h-4 inline" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
        </button>
      </div>
    </div>

    <!-- Results -->
    <div id="results" class="space-y-4"></div>

    <!-- Live Logs -->
    <div id="logBox" class="bg-black text-green-400 font-mono text-sm p-4 rounded-md mt-6 whitespace-pre overflow-y-auto hidden h-64"></div>


    <!-- Error Message -->
    <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md"></div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const results = document.getElementById('results');
    const errorMessage = document.getElementById('errorMessage');

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    function performSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      setLoadingState(true);
      clearResults();
      hideError();

      fetch('http://localhost:8081/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: query })
      })
      .then(res => res.ok ? res.text() : Promise.reject(`HTTP error! status: ${res.status}`))
      .then(displayResults)
      .catch(err => showError(`Search failed: ${err}`))
      .finally(() => setLoadingState(false));
    }

    function displayResults(data) {
      try {
        const parsedData = JSON.parse(data);
        if (!Array.isArray(parsedData) || parsedData.length === 0) return showError('No results found');

        let html = `
          <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="bg-gray-50 px-4 py-2 border-b">
              <h3 class="font-medium text-gray-900">Search Results (${parsedData.length})</h3>
            </div>`;

        parsedData.forEach(item => {
          const stars = parseInt(item.star_count || item.Stars || 0);
          const name = item.name || item.Name || 'Unknown';
          const description = item.description || item.Description || '';
          const isOfficial = item.is_official || item.IsOfficial;
          const isAutomated = item.is_automated || item.IsAutomated;

          html += `
            <div class="p-4 border-b border-gray-100 last:border-b-0 hover:bg-gray-50">
              <div class="flex items-start justify-between">
                <div class="flex-1">
                  <div class="flex items-center gap-2 mb-2">
                    <h4 class="font-medium text-gray-900 text-lg">${name}</h4>
                    ${isOfficial ? '<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full font-medium">Official</span>' : ''}
                    ${isAutomated ? '<span class="bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded-full font-medium">Automated</span>' : ''}
                  </div>
                  <div class="flex items-center gap-1 mb-2">
                    <svg class="w-4 h-4 fill-current text-yellow-500" viewBox="0 0 20 20">
                      <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292..."/>
                    </svg>
                    <span class="text-sm font-medium text-gray-700">${stars.toLocaleString()} stars</span>
                  </div>
                  <p class="text-gray-600 text-sm">${description || 'No description available'}</p>
                </div>
                <div class="ml-4 flex-shrink-0">
                  <button 
                    class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 text-sm font-medium"
                    onclick="selectImage('${name}')"
                  >
                    Select
                  </button>
                </div>
              </div>
            </div>`;
        });

        html += '</div>';
        results.innerHTML = html;
      } catch (err) {
        showError(`Error displaying results: ${err.message}`);
      }
    }

    function setLoadingState(loading) {
      searchBtn.disabled = loading;
      btnText.classList.toggle('hidden', loading);
      btnSpinner.classList.toggle('hidden', !loading);
    }

    function clearResults() {
      results.innerHTML = '';
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
    }

    function hideError() {
      errorMessage.classList.add('hidden');
    }
    
    function selectImage(name) {
      const logBox = document.getElementById('logBox');
      logBox.classList.remove('hidden');
      logBox.textContent = `Starting container for "${name}"...\n`;

      fetch('http://localhost:8081/api/createContainer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      })
      .then(response => {
        if (!response.body) throw new Error("No response body");

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        function readStream() {
          return reader.read().then(({ done, value }) => {
            if (done) return;
            const chunk = decoder.decode(value, { stream: true });
            logBox.textContent += chunk;
            logBox.scrollTop = logBox.scrollHeight;
            return readStream(); // Keep reading
          });
        }

        return readStream();
      })
      .catch(err => {
        logBox.textContent += `\nError: ${err}`;
        showError(`Failed to create container: ${err}`);
      });
    }


  </script>
</body>
</html>
